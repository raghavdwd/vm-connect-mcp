name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --filter vm-connect-mcp

      - name: Run unit tests
        run: |
          bun test packages/cli

      - name: Compile all platform binaries
        run: |
          mkdir -p dist
          echo "Compiling Linux x64..."
          bun build ./packages/cli/src/cli.ts --compile --target=bun-linux-x64 --outfile ./dist/vm-connect-linux-x64
          echo "Compiling Linux arm64..."
          bun build ./packages/cli/src/cli.ts --compile --target=bun-linux-arm64 --outfile ./dist/vm-connect-linux-arm64
          echo "Compiling macOS Apple Silicon (arm64)..."
          bun build ./packages/cli/src/cli.ts --compile --target=bun-darwin-arm64 --outfile ./dist/vm-connect-darwin-arm64
          echo "Compiling macOS Intel (x64)..."
          bun build ./packages/cli/src/cli.ts --compile --target=bun-darwin-x64 --outfile ./dist/vm-connect-darwin-x64
          echo "Compiling Windows x64..."
          bun build ./packages/cli/src/cli.ts --compile --target=bun-windows-x64 --outfile ./dist/vm-connect-windows-x64.exe

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum vm-connect-* > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vm-connect-*
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
