name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: vm-connect-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: vm-connect-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: vm-connect-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            artifact: vm-connect-darwin-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact: vm-connect-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --filter vm-connect-mcp

      - name: Run unit tests
        run: |
          bun test packages/cli

      - name: Compile standalone binary
        run: |
          bun build ./packages/cli/src/cli.ts --compile --target=${{ matrix.target }} --outfile ./dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
